name: Build and deploy Hugo
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.24.3'
          cache: true
      - name: Install Hugo Extended
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-${{ github.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-
      - name: Download pinned theme modules
        run: hugo mod get
      - name: Install image migration dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/image-tools"
          "$RUNNER_TEMP/image-tools/bin/python" -m pip install -r requirements-images.txt
          echo "$RUNNER_TEMP/image-tools/bin" >> "$GITHUB_PATH"
      - name: Test migration converter
        run: python3 -m unittest discover -s tests -v
      - name: Build
        run: |
          mkdir -p .migration
          set -o pipefail
          hugo --gc --minify --cleanDestinationDir --cacheDir "$RUNNER_TEMP/hugo_cache" 2>&1 | tee .migration/hugo-build.log
      - name: Summarize image fetch warnings
        run: python3 scripts/report_resources.py .migration/hugo-build.log
      - name: Validate generated site
        run: python3 scripts/verify_site.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
