baseURL = 'https://fjiayang.github.io/'
title = 'F嘉阳'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
timeZone = 'Asia/Shanghai'
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = 'github.com/CaiJimmy/hugo-theme-stack/v4'

[pagination]
  pagerSize = 10

[permalinks]
  post = '/archives/:slug/'
  page = '/:slug/'

[params]
  mainSections = ['post']
  description = 'F嘉阳的博客'
  rssFullContent = true
  [params.sidebar]
    subtitle = '开发、云原生与工程实践'
  [params.footer]
    since = 2018
  [params.comments]
    enabled = false
    provider = ''
  [params.article]
    toc = true
    readingTime = true
    headingAnchor = true
  [params.imageProcessing.content]
    enabled = false
  [params.imageProcessing.thumbnail]
    enabled = false
  [params.colorScheme]
    toggle = true
    default = 'auto'
  [params.widgets]
    homepage = [{type = 'search'}, {type = 'archives', params = {limit = 5}}, {type = 'categories', params = {limit = 10}}, {type = 'tag-cloud', params = {limit = 20}}]
    page = [{type = 'toc'}]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    endLevel = 4
    startLevel = 2

[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 10
    [menu.main.params]
      icon = 'home'
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 20
    [menu.main.params]
      icon = 'archives'
  [[menu.main]]
    name = '分类'
    url = '/categories/'
    weight = 30
    [menu.main.params]
      icon = 'categories'
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 40
    [menu.main.params]
      icon = 'tag'
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 50
    [menu.main.params]
      icon = 'search'
  [[menu.main]]
    name = '源码'
    url = '/project.html'
    weight = 60
    [menu.main.params]
      icon = 'brand-github'
  [[menu.main]]
    name = '友情链接'
    url = '/links.html'
    weight = 70
    [menu.main.params]
      icon = 'link'
